<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulado em andamento — Português para Concursos</title>
  <meta name="description" content="Simulado de Língua Portuguesa em andamento: uma questão por tela, cronômetro, barra de progresso, marcação para revisão e navegação entre questões.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b2545">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="siteHeader"></div>

  <main id="conteudo">
    <section class="section" style="padding-top:1.6rem">
      <div class="container">
        <div id="semSimulado" hidden>
          <div class="empty-state card">
            <h2>Nenhum simulado em andamento</h2>
            <p>Configure um novo simulado para começar. Você escolhe a quantidade de questões, o nível e os assuntos.</p>
            <a class="btn btn-primary" href="simulados.html">Montar simulado</a>
          </div>
        </div>

        <div id="simuladoAtivo" hidden>
          <div class="exam-shell">
            <div>
              <div style="display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:1rem">
                <div>
                  <h1 style="font-size:1.35rem;margin:0">Simulado em andamento</h1>
                  <p class="muted" style="font-size:.85rem;margin:.2rem 0 0" id="examInfo"></p>
                </div>
                <button class="btn btn-sm btn-danger" type="button" id="btnFinalizarTopo">Finalizar simulado</button>
              </div>

              <div class="card" id="examCard" style="margin-bottom:1rem"></div>

              <div style="display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between">
                <div class="btn-row">
                  <button class="btn btn-outline" type="button" id="btnAnterior">← Anterior</button>
                  <button class="btn btn-outline" type="button" id="btnFlag">Marcar para revisão</button>
                </div>
                <div class="btn-row">
                  <button class="btn btn-primary" type="button" id="btnProxima">Próxima →</button>
                  <button class="btn btn-success" type="button" id="btnFinalizar">Finalizar</button>
                </div>
              </div>
            </div>

            <aside class="exam-side">
              <div class="card" style="margin-bottom:1rem">
                <div class="timer" id="timer">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
                  <span id="timerText">00:00</span>
                </div>
                <p class="muted" style="font-size:.76rem;margin:.4rem 0 0">Tempo decorrido</p>
                <div class="progress-bar" style="margin-top:1rem"><i id="progressFill" style="width:0%"></i></div>
                <div class="progress-meta">
                  <span id="progressText">0 de 0 respondidas</span>
                  <span id="progressPct">0%</span>
                </div>
              </div>
              <div class="card">
                <h3 style="font-size:.9rem">Mapa de questões</h3>
                <div class="qmap" id="qmap"></div>
                <div class="legend">
                  <span><i style="background:var(--blue-600)"></i> Respondida</span>
                  <span><i style="background:var(--surface-3);border:1px solid var(--border)"></i> Pendente</span>
                  <span><i style="background:var(--yellow-500)"></i> Revisão</span>
                </div>
                <button class="btn btn-danger btn-block btn-sm" type="button" id="btnFinalizarLado" style="margin-top:1rem">Finalizar simulado</button>
                <button class="btn btn-ghost btn-block btn-sm" type="button" id="btnAbortar" style="margin-top:.4rem">Abandonar simulado</button>
              </div>
            </aside>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/core.js"></script>
  <script src="js/data/modules-1.js"></script>
  <script src="js/data/modules-2.js"></script>
  <script src="js/data/modules-3.js"></script>
  <script src="js/data/questions-1.js"></script>
  <script src="js/data/questions-2.js"></script>
  <script src="js/data/questions-3.js"></script>
  <script src="js/data/tips.js"></script>
  <script src="js/data/redacao.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/simulado-run.js"></script>
</body>
</html>
